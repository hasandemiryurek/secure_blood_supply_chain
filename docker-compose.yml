services:
  # Hardhat Node -
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile.hardhat
    container_name: blood-chain-hardhat
    ports:
      - "8545:8545"
    networks:
      - blood-chain-network
    volumes:
      - ./artifacts:/app/artifacts
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Backend Server 
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blood-chain-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - RPC_URL=http://hardhat:8545
      - NODE_ENV=development
    networks:
      - blood-chain-network
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./artifacts:/app/artifacts
    depends_on:
      hardhat:
        condition: service_healthy

  # IoT Simulator
  iot-simulator:
    build:
      context: .
      dockerfile: Dockerfile.iot
    container_name: blood-chain-iot
    environment:
      - BACKEND_URL=http://backend:3000
      - RPC_URL=http://hardhat:8545
      - DOCKER_ENV=true
    networks:
      - blood-chain-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  blood-chain-network:
    driver: bridge