version: '3.8'

services:
  # Hardhat Node - Local Blockchain
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile.hardhat
    container_name: blood-chain-hardhat
    ports:
      - "8545:8545"
    networks:
      - blood-chain-network
    volumes:
      - ./artifacts:/app/artifacts
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8545', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server (Express + IPFS)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blood-chain-backend
    ports:
      - "3000:3000"
      - "5001:5001"  # IPFS API
      - "8080:8080"  # IPFS Gateway
    environment:
      - PORT=3000
      - RPC_URL=http://hardhat:8545
      - NODE_ENV=development
    networks:
      - blood-chain-network
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./artifacts:/app/artifacts
      - ipfs-data:/data/ipfs
    depends_on:
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IoT Simulator
  iot-simulator:
    build:
      context: .
      dockerfile: Dockerfile.iot
    container_name: blood-chain-iot
    environment:
      - BACKEND_URL=http://backend:3000
    networks:
      - blood-chain-network
    volumes:
      - ./iot-simulator:/app/iot-simulator
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  blood-chain-network:
    driver: bridge

volumes:
  ipfs-data:
